[project]
name = "thoxa-antidoom"
version = "0.1.0"
description = "Targeted FTPO training to eliminate doom loops in reasoning models"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Tommy Xaypanya", email = "tommy@thox.ai" }]
dependencies = [
    "torch>=2.5",
    "transformers>=4.46",
    "trl>=0.12",
    "peft>=0.13",
    "datasets>=3.0",
    "vllm>=0.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "accelerate>=1.0",
]

[project.scripts]
thoxa-antidoom = "thoxa_antidoom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thoxa_antidoom"]

[tool.uv]
dev-dependencies = ["pytest>=8.0", "ruff>=0.8"]
