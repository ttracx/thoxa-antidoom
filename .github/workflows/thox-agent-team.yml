name: THOX Agent Team

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, closed]
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: daily, issues, prs, prune"
        required: false
        default: "daily"
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read
  statuses: read
  actions: read
  metadata: read

concurrency:
  group: thox-agent-team-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  review:
    name: Review issues and pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: THOX issue and PR review
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const requiredLabels = [
              'agent:resolve',
              'agent:review',
              'agent:auto-merge',
              'agent:blocked',
              'human-required',
              'do-not-merge',
              'security:manual-review',
              'type:bug',
              'type:dependency',
              'type:security',
              'area:docs'
            ];

            const colorFor = (label) => {
              if (label.startsWith('agent:')) return '10B981';
              if (label.startsWith('type:')) return 'A855F7';
              if (label.startsWith('area:')) return '34D399';
              return '6B7280';
            };

            for (const label of requiredLabels) {
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: colorFor(label),
                  description: `THOX automation label: ${label}`
                });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

            const skipLabels = new Set(['agent:blocked', 'human-required', 'do-not-merge', 'security:manual-review']);
            const autoMergeLabel = 'agent:auto-merge';
            const reviewLabel = 'agent:review';

            async function comment(issue_number, body) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

            async function issueLabels(issue_number) {
              const { data } = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number, per_page: 100 });
              return new Set(data.map((label) => label.name));
            }

            async function combinedStatus(sha) {
              const { data } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha });
              return data.state;
            }

            async function checkRunsPass(sha) {
              const { data } = await github.rest.checks.listForRef({ owner, repo, ref: sha, per_page: 100 });
              if (!data.check_runs.length) return true;
              return data.check_runs.every((run) => ['success', 'neutral', 'skipped'].includes(run.conclusion));
            }

            async function maybeReviewPr(pr) {
              const labels = await issueLabels(pr.number);
              if ([...skipLabels].some((label) => labels.has(label))) return;
              if (!labels.has(reviewLabel) && !labels.has(autoMergeLabel)) return;

              const status = await combinedStatus(pr.head.sha);
              const checksOk = await checkRunsPass(pr.head.sha);
              const ready = !pr.draft && checksOk && ['success', 'pending'].includes(status);

              await comment(pr.number, [
                'THOX Agent Team review:',
                '',
                `- Draft: ${pr.draft ? 'yes' : 'no'}`,
                `- Combined status: ${status}`,
                `- Check runs pass: ${checksOk ? 'yes' : 'no'}`,
                `- Safe merge eligible: ${ready && labels.has(autoMergeLabel) ? 'yes' : 'no'}`,
                '',
                'Auto-merge requires `agent:auto-merge`, no blocking labels, same-repository branch, and passing checks.'
              ].join('\n'));

              if (!labels.has(autoMergeLabel) || !ready) return;
              if (pr.head.repo.full_name !== `${owner}/${repo}`) {
                await comment(pr.number, 'Auto-merge blocked: fork pull requests are not merged automatically.');
                return;
              }

              const { data: repository } = await github.rest.repos.get({ owner, repo });
              if (pr.head.ref === repository.default_branch) {
                await comment(pr.number, 'Auto-merge blocked: head branch is the default branch.');
                return;
              }

              const merge = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pr.number,
                merge_method: 'squash',
                commit_title: `Merge PR #${pr.number}: ${pr.title}`,
                commit_message: 'Merged by THOX Agent Team after configured safety gates passed.',
                sha: pr.head.sha
              });

              if (merge.data.merged) {
                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` });
                  await comment(pr.number, `Merged and pruned branch \`${pr.head.ref}\`.`);
                } catch (error) {
                  await comment(pr.number, `Merged, but branch pruning skipped for \`${pr.head.ref}\`: ${error.message}`);
                }
              }
            }

            if (context.eventName === 'pull_request') {
              await maybeReviewPr(context.payload.pull_request);
            }

            if (context.eventName === 'issues') {
              const issue = context.payload.issue;
              if (!issue.pull_request) {
                const titleBody = `${issue.title}\n${issue.body || ''}`.toLowerCase();
                const labels = [];
                if (titleBody.match(/bug|error|fail|broken/)) labels.push('type:bug');
                if (titleBody.match(/docs|readme|documentation/)) labels.push('area:docs');
                if (titleBody.match(/dependency|package|version/)) labels.push('type:dependency');
                if (titleBody.match(/secret|token|auth|credential/)) labels.push('type:security', 'security:manual-review');
                if (labels.length) await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels });
              }
            }

            if (context.eventName === 'schedule' || context.eventName === 'workflow_dispatch') {
              const { data: pulls } = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 50 });
              for (const pr of pulls) await maybeReviewPr(pr);
            }
